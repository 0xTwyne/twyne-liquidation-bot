# This is a basic workflow to help you get started with Actions

name: Dependency Workflows
# Controls when the action will run.
on:
  # Checks the uv lock file is up to date on every PR change.
  # Uses plain pull_request (not pull_request_target) so the workflow runs
  # against the PR head, not the base branch.
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - 'main'
      - 'master'
    paths:
      - 'pyproject.toml'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  check_deps:
    strategy:
      matrix:
        python-versions:
        - 3.12
        os:
        - ubuntu-24.04
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-versions }}
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Install application deps
        run: uv sync --frozen

      - name: Check lock file is up to date
        run: uv lock --check
