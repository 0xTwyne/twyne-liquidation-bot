# This is a basic workflow to help you get started with Actions

name: Code Quality
# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - "3.11"
        - "3.13"
        os: [ubuntu-22.04,]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        with:
          submodules: recursive
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Install Foundry
        # v1.9.0 switched to the standalone Rust rewrite of foundryup. Pins at
        # or below v1.8.0 invoke the installer with `bash`, which now fails —
        # `foundryup: cannot execute binary file` — because the artifact it
        # downloads is an ELF binary, not a shell script. Do not pin back.
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.7.1
      - name: Run Forge build
        run: |
          forge --version
          forge build --sizes
        id: build
      - name: Install Packages
        run: |
          uv sync --frozen
      - name: Lint
        run: |
          uv run make lint
      - name: Tests
        env:
          # MAINNET_RPC_URL: used by the Python config loader (ChainConfig) at
          # test time for chain 1. Falls back to the public Tenderly gateway
          # when the secret is not set (e.g. in forks / external contributors).
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL || 'https://gateway.tenderly.co/public/mainnet' }}
          # FOUNDRY_ETH_RPC_URL: overrides eth_rpc_url in foundry.toml via the
          # FOUNDRY_ prefix (toml ${VAR} interpolation is not supported).
          # Same value as MAINNET_RPC_URL; set to an authenticated archive
          # endpoint via the secret when available.
          FOUNDRY_ETH_RPC_URL: ${{ secrets.MAINNET_RPC_URL || 'https://gateway.tenderly.co/public/mainnet' }}
        run: |
          uv run make tests

  docker-build:
    name: Docker image smoke build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
      - name: Build Docker image
        run: docker build --no-cache -t liquidation-bot:ci-test .
