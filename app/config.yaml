global:
  ## RISK PARAMETERS ##
  # Health score thresholds used by the cadence step functions.
  HS_LIQUIDATION: 1.0      # HF <= this: at-or-past liquidation boundary
  HS_CORRELATED_HIGH: 1.02 # HF < this on a correlated pair: high-attention zone
  HS_HIGH_RISK: 1.05
  HS_MEDIUM_RISK: 1.10
  HS_SAFE: 1.25

  # Cadence intervals (seconds) for CVs whose (collateral, debt) pair is in the
  # per-chain `correlated_pairs` whitelist. Step function on internal/external HF
  # (worst of the two picks the bucket).
  cadence_correlated:
    LIQ: 60        # HF <= HS_LIQUIDATION (or externally liquidated)
    HIGH: 900      # HF < HS_CORRELATED_HIGH
    SAFE: 3600     # HF >= HS_CORRELATED_HIGH

  # Cadence intervals (seconds) for all other CVs. Same step-function semantics.
  cadence_uncorrelated:
    LIQ: 60        # HF < HS_CORRELATED_HIGH (or externally liquidated)
    HIGH_1: 300    # HF < HS_HIGH_RISK
    HIGH_2: 600    # HF < HS_MEDIUM_RISK
    MEDIUM: 1800   # HF < HS_SAFE
    SAFE: 3600     # HF >= HS_SAFE

  ## REPORTING PARAMETERS ##
  # Interval for reporting low health accounts
  LOW_HEALTH_REPORT_INTERVAL: 10800 # 180 minutes in seconds
  SLACK_REPORT_HEALTH_SCORE: 1.15
  # Threshold for excluding small positions from frequent notifications, in USD terms
  SMALL_POSITION_THRESHOLD: 1000000000000000000000 # 1000 USD
  SMALL_POSITION_REPORT_INTERVAL: 43200 # 12 hours (43200 seconds)
  # Cooldown for reporting errors
  ERROR_COOLDOWN: 900

  # Minimum off-chain net liquidation profit, in whole USD, evaluated in the
  # position's unit of account (swap surplus minus gas, both priced via the
  # oracle router). A liquidation is only executed when net USD profit >= this.
  # May be NEGATIVE to intentionally accept a small USD loss in order to clear a
  # liquidatable position (e.g. dust / bad-debt cleanup). Can be overridden
  # per-chain under `chains:` (chain config takes precedence over global).
  MIN_NET_PROFIT_USD: 0

  ## MONITORING PARAMETERS ##
  # Maximum time between updates for any vault (even empty ones), in seconds
  # This ensures no vault is ever "forgotten" - default 1 day
  MAX_UPDATE_INTERVAL_SECONDS: 86400

  # Batch size for scanning blocks on startup
  BATCH_SIZE: 10000
  BATCH_INTERVAL: 0.2
  # Time to wait between scanning for new collateral vaults on regular intervals
  SCAN_INTERVAL: 300 # 5 minutes

  ## PATHS ##
  EVAULT_ABI_PATH: "contracts/EVault.json"
  ATOKEN_WRAPPER_ABI_PATH: "contracts/AaveV3ATokenWrapper.json"
  EVC_ABI_PATH: "contracts/EthereumVaultConnector.json"
  ERC20_ABI_PATH: "contracts/IERC20.json"
  LOGS_PATH: "logs"
  SAVE_STATE_PATH: "state"
  SAVE_INTERVAL: 120 # 2 minutes (120 seconds)

  ## Twyne
  CVAULT_FACTORY_ABI_PATH: "contracts/CollateralVaultFactory.json"
  EULER_CVAULT_ABI_PATH: "contracts/EulerCollateralVault.json"
  HEALTHSTATVIEWER_ABI_PATH: "contracts/HealthStatViewer.json"
  VAULT_MANAGER_ABI_PATH: "contracts/VaultManager.json"
  EULER_ROUTER_ABI_PATH: "contracts/EulerRouter.json"
  LIQUIDATOR_CONTRACT_ABI_PATH: "contracts/TwyneLiquidator.json"

  ## Twyne Aave
  AAVE_CVAULT_ABI_PATH: "contracts/AaveV3CollateralVault.json"
  AAVE_WRAPPER_ABI_PATH: "contracts/AaveV3ATokenWrapper.json"
  AAVE_POOL_ABI_PATH: "contracts/AaveV3Pool.json"
  AAVE_LIQUIDATOR_ABI_PATH: "contracts/TwyneAaveLiquidator.json"
  ## API CALL PARAMETERS ##
  # API Retry
  RETRY_DELAY: 10

  ## ADDRESSES ##
  USDS_ADDRESS: "0x820C137fa70C8691f0e44Dc420a5e53c168921Dc"
  ## TWYNE_EOA_VAULTS and SLACK_MENTION_IDS are loaded from environment variables.
  ## See .env.example for configuration.

